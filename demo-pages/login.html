<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>登录页面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", sans-serif;
    }

    body {
      background: linear-gradient(to right, #5433ff, #20bdff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .input-box {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #20bdff;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #20bdff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #5433ff;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>用户登录</h2>

    <div class="input-box">
      <input id="username" type="text" placeholder="请输入账号">
    </div>

    <div class="input-box">
      <input id="password" type="password" placeholder="请输入密码">
    </div>

    <button onclick="login()">登录</button>
  </div>

  <script>
    function login() {
      // 拿到用户输入的账号和密码
      let user = document.getElementById("username").value;
      let pwd = document.getElementById("password").value;

      // 设置正确的账号密码
      let rightUser = "admin";
      let rightPwd = "123456";

      // 判断
      if (user === rightUser && pwd === rightPwd) {
        alert("登录成功！欢迎回来！🎉");
        // 登录成功后跳转到主页
        window.location.href = "index.html";
      } else {
        alert("账号或密码错误！❌");
      }
    }
  </script>

</body>

</html>
