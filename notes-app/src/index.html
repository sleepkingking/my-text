<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>我的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(to right, #5433ff, #20bdff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #20bdff;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            color: #222;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }

        .info {
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 30px;
            background: #20bdff;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5433ff;
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

    <div class="card">
        <img class="avatar" src="https://picsum.photos/200/200">

        <h1>我的个人主页</h1>
        <p class="desc">一个正在学习前端的新手</p>
        <p class="info">今天成功写出了第一个漂亮网页！</p>

        <button onclick="alert('我的主页超好看！🎉')">点我点赞</button>
    </div>

</body>

</html>
