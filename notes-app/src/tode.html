<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>待办清单</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", sans-serif;
    }

    body {
      background: linear-gradient(to right, #5433ff, #20bdff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 12px 20px;
      background: #20bdff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #5433ff;
    }

    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .task.done {
      text-decoration: line-through;
      color: #999;
      background: #e0e0e0;
    }

    .task button {
      background: #ff4757;
      padding: 6px 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>我的待办清单</h2>

    <div class="input-group">
      <input id="taskInput" placeholder="输入要做的事...">
      <button onclick="addTask()">添加</button>
    </div>

    <div id="taskList"></div>
  </div>

  <script>
    // 添加任务
    function addTask() {
      let input = document.getElementById("taskInput");
      let text = input.value.trim();

      if (!text) return;

      let taskList = document.getElementById("taskList");
      let div = document.createElement("div");
      div.className = "task";
      div.innerHTML = `
                <span>${text}</span>
                <button onclick="delTask(this)">删除</button>
            `;

      // 点击切换完成状态
      div.querySelector("span").onclick = function () {
        div.classList.toggle("done");
      };

      taskList.appendChild(div);
      input.value = "";
    }

    // 删除任务
    function delTask(btn) {
      btn.parentElement.remove();
    }
  </script>

</body>

</html>
